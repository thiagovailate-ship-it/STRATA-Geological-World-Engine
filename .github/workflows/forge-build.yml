name: Forge 1.7.10 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and package STRATA
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Verify Java and Gradle wrapper
        run: |
          java -version
          ./gradlew --version

      - name: Build against Minecraft Forge 1.7.10
        run: ./gradlew --no-daemon --stacktrace setupDecompWorkspace build

      - name: Verify the mod jar
        run: |
          test -s build/libs/STRATA-1.0.0.jar
          jar tf build/libs/STRATA-1.0.0.jar > build/strata-jar-contents.txt
          grep -Fxq 'mcmod.info' build/strata-jar-contents.txt
          grep -Fxq 'dev/strata/forge/StrataMod.class' build/strata-jar-contents.txt

      - name: Upload the compiled mod
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: STRATA-1.0.0
          path: build/libs/STRATA-1.0.0.jar
          if-no-files-found: ignore
          retention-days: 14

      - name: Run deterministic engine regression tests
        run: bash tools/run-tests.sh

      - name: Summarize core regression results
        if: always()
        run: |
          if [ -f out/test-output.txt ]; then
            {
              echo '## Core regression test output'
              echo '```text'
              tail -n 80 out/test-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if grep -q '^\[FAIL ' out/test-output.txt; then
              failures="$(grep '^\[FAIL ' out/test-output.txt | tr '\n' ';')"
              echo "::error title=Core regression tests failed::${failures}"
            fi
          fi
