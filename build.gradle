// STRATA — Geological World Engine. Real Forge build (needs network + JDK 8):
//   ./gradlew setupDecompWorkspace build
// Produces build/libs/STRATA-1.0.0.jar. Sandbox-safe checks that need no
// network: tools/build-core.sh, tools/run-tests.sh, tools/stubcheck.sh.
buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'forge'
            url = 'http://files.minecraftforge.net/maven'
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = "1.0.0"
group = "dev.strata"
archivesBaseName = "STRATA"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

// Java 7 bytecode on a JDK 8 toolchain: the highest the 1.7.10 runtime
// supports. tools/check-legacy-api.sh enforces the same ceiling in the
// sandbox (whose compiler cannot target 1.7 anymore).
sourceCompatibility = targetCompatibility = "1.7"

dependencies {
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.7.10'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
