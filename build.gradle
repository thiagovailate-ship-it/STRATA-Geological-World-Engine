// STRATA — Geological World Engine. Forge build (JDK 8):
//   ./gradlew setupDecompWorkspace build
// Produces build/libs/STRATA-1.0.0.jar. ForgeGradle 1.2-1.1.1 is an HTTPS-safe
// compatibility fork for Minecraft 1.7.10 and supports the Gradle 4.4.1
// wrapper pinned in gradle/wrapper/gradle-wrapper.properties.
// Offline/core checks: tools/build-core.sh, tools/run-tests.sh, tools/stubcheck.sh.
buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'forge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.1.1'
    }
}

apply plugin: 'forge'

version = "1.0.0"
group = "dev.strata"
archivesBaseName = "STRATA"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

// Java 7 bytecode on a JDK 8 toolchain: the highest the 1.7.10 runtime
// supports. tools/check-legacy-api.sh enforces the same ceiling in the
// sandbox (whose compiler cannot target 1.7 anymore).
sourceCompatibility = targetCompatibility = "1.7"

dependencies {
}

// The repository's A-J regression harness is a plain main() program, not JUnit.
// It is run by tools/run-tests.sh (including in GitHub Actions); prevent Gradle's
// default JUnit discovery from treating the harness classes as framework tests.
test {
    enabled = false
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.7.10'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
